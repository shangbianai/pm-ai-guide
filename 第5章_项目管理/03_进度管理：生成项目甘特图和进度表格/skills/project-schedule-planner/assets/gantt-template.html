<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>项目甘特图模板</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:40px;background:#f6f8fb;color:#17202a}.bar{height:28px;border-radius:999px;background:linear-gradient(90deg,#2f80ed,#27ae60);color:white;padding:5px 14px;margin:10px 0}.row{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}</style><h1>项目甘特图模板</h1><div id="app"></div><script>const tasks=[{name:'需求确认',start:0,duration:4},{name:'原型设计',start:3,duration:5},{name:'开发联调',start:8,duration:10},{name:'验收上线',start:18,duration:5}];app.innerHTML=tasks.map(t=>`<div class="row"><b>${t.name}</b><div class="bar" style="margin-left:${t.start*22}px;width:${t.duration*44}px">${t.duration}天</div></div>`).join('')</script></html>
