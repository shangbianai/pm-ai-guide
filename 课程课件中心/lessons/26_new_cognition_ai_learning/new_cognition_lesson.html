<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新认知</title>
<style>
:root{--bg:#050509;--ink:#f8fafc;--muted:#a7b0c0;--line:rgba(255,255,255,.14);--gold:#facc15;--orange:#fb923c;--cyan:#22d3ee;--pink:#f472b6}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at 15% 12%,rgba(250,204,21,.16),transparent 28%),radial-gradient(circle at 84% 12%,rgba(34,211,238,.15),transparent 27%),radial-gradient(circle at 50% 90%,rgba(244,114,182,.12),transparent 34%),linear-gradient(135deg,#030305,#090914 54%,#130d08);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:70px 70px;mask-image:radial-gradient(circle at center,#000,transparent 78%);pointer-events:none}.deck{height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 64px 86px;position:relative}.slide{display:none;width:min(1680px,calc(100vw - 128px));height:min(820px,calc(100vh - 130px));position:relative;overflow:visible}.slide.active{display:block;animation:fadeIn .42s ease both}@keyframes fadeIn{from{opacity:0;transform:translateY(12px) scale(.992)}to{opacity:1;transform:none}}.cover{height:100%;display:grid;place-items:center;text-align:center}.cover>div{width:100%;transform:translateY(36px)}.title-line{font-size:clamp(38px,4.9vw,86px);line-height:1.08;font-weight:1000;letter-spacing:0;margin:0;white-space:nowrap}.title-line .hot{background:linear-gradient(135deg,#fde68a,#facc15 40%,#fb923c 72%,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 34px rgba(250,204,21,.18)}.subtitle{min-height:58px;margin-top:54px;color:#d8dee9;font-size:clamp(18px,1.75vw,30px);font-weight:760;letter-spacing:0;text-align:center}.subtitle.typing:after{content:"";display:inline-block;width:2px;height:1em;background:#facc15;margin-left:6px;vertical-align:-.12em;animation:blink .8s steps(1) infinite}@keyframes blink{50%{opacity:0}}.fullscreen{position:fixed;right:32px;top:28px;z-index:110;height:42px;min-width:92px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.07);color:#fff;font-weight:950;cursor:pointer;backdrop-filter:blur(16px)}.cards-page{height:100%;display:flex;align-items:center;justify-content:center;overflow:visible}.element-row{width:min(1320px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:0 auto}.element-card{width:100%;min-height:min(560px,64vh);aspect-ratio:3/4;border:1px solid var(--line);border-radius:34px;background:linear-gradient(155deg,rgba(255,255,255,.12),rgba(255,255,255,.035));box-shadow:0 26px 70px rgba(0,0,0,.32);display:grid;place-items:center;position:relative;overflow:hidden;opacity:0;transform:translateY(34px) scale(.96);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.85,.22,1)}.element-card.show{opacity:1;transform:none}.element-card:before{content:"";position:absolute;inset:-45%;background:conic-gradient(from 0deg,transparent,rgba(250,204,21,.22),transparent,rgba(34,211,238,.14),transparent);animation:spin 11s linear infinite}.element-card:after{content:attr(data-no);position:absolute;right:22px;top:18px;color:rgba(255,255,255,.16);font-size:52px;font-weight:1000}.element-card b{position:relative;z-index:2;font-size:clamp(38px,4vw,70px);letter-spacing:8px;background:linear-gradient(135deg,#fff,#fde68a 45%,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent}.element-card:nth-child(2) b{background:linear-gradient(135deg,#fff,#fbcfe8 45%,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}.element-card:nth-child(3) b{background:linear-gradient(135deg,#fff,#fed7aa 45%,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}.element-card:nth-child(4) b{background:linear-gradient(135deg,#fff,#bbf7d0 45%,#22c55e);-webkit-background-clip:text;background-clip:text;color:transparent}@keyframes spin{to{transform:rotate(360deg)}}.tag-page{height:100%;display:grid;grid-template-rows:1fr auto;gap:24px}.tag-cloud{position:relative;border:1px solid rgba(255,255,255,.09);border-radius:36px;background:rgba(255,255,255,.035);overflow:hidden;padding:36px}.tag{position:absolute;display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 16px;border-radius:14px;background:rgba(255,255,255,.92);color:#101014;font-size:17px;font-weight:950;box-shadow:0 16px 36px rgba(0,0,0,.32);transform:rotate(var(--r)) scale(.86);animation:floaty var(--d) ease-in-out infinite alternate;opacity:0;transition:opacity .38s ease,transform .38s cubic-bezier(.2,.85,.22,1)}.tag.show{opacity:.96;transform:rotate(var(--r)) scale(1)}.tag:nth-child(3n){background:#fef3c7}.tag:nth-child(4n){background:#dbeafe}.tag:nth-child(5n){background:#fce7f3}.tag:nth-child(7n){background:#dcfce7}@keyframes floaty{from{translate:0 0}to{translate:0 -12px}}.big-overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(250,204,21,.18),rgba(0,0,0,.84) 58%,rgba(0,0,0,.92));z-index:8;opacity:0;pointer-events:none;transform:scale(.96);transition:opacity .45s ease,transform .45s ease}.big-overlay.show{opacity:1;transform:none}.big-overlay b{font-size:clamp(64px,10vw,170px);line-height:1;letter-spacing:0;color:white;text-shadow:0 0 50px rgba(250,204,21,.35)}.gold-quote{opacity:0;transform:translateY(16px);transition:opacity .38s ease,transform .38s ease;border:1px solid rgba(250,204,21,.28);border-radius:28px;background:linear-gradient(135deg,rgba(250,204,21,.14),rgba(251,146,60,.08),rgba(255,255,255,.04));padding:26px 32px;text-align:center;color:#fff;font-size:clamp(24px,2.7vw,44px);line-height:1.28;font-weight:1000;box-shadow:0 22px 60px rgba(0,0,0,.28)}.gold-quote.show{opacity:1;transform:none}.gold-quote span{color:#facc15}.nav{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);backdrop-filter:blur(16px)}.nav button{width:40px;height:36px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-size:18px;font-weight:950;cursor:pointer}.page{min-width:46px;text-align:center;font-weight:950;color:#d8dee9}.draw-toggle,.draw-tools{position:fixed;right:32px;bottom:24px;z-index:105;align-items:center;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);backdrop-filter:blur(16px)}.draw-toggle{display:inline-flex;justify-content:center;height:42px;min-width:82px;padding:0 18px;color:#fff;font-size:14px;font-weight:950;cursor:pointer}.draw-tools{display:none;gap:8px;padding:8px}body.drawing .draw-toggle{display:none}body.drawing .draw-tools{display:flex}.swatch{width:28px;height:28px;border:2px solid rgba(255,255,255,.72);border-radius:50%;cursor:pointer}.clear{height:28px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.09);color:white;padding:0 11px;font-weight:950;cursor:pointer}.help{display:none}#drawCanvas{position:fixed;inset:0;z-index:70;pointer-events:none}body.drawing #drawCanvas{pointer-events:auto;cursor:crosshair}@media(max-width:1100px){.deck{padding:44px 24px 86px}.title-line{white-space:normal}.element-row{grid-template-columns:repeat(2,1fr)}.element-card{min-height:260px;aspect-ratio:auto}.tag{font-size:14px}.gold-quote{font-size:24px}}
</style>
</head>
<body>
<button class="fullscreen" onclick="toggleFullscreen()">全屏</button>
<canvas id="drawCanvas"></canvas>
<main class="deck">
<section class="slide active" onclick="startTyping()"><div class="cover"><div><h1 class="title-line">新认知：普通人学习 AI 必备的<span class="hot">四个要素！</span></h1><div class="subtitle" id="subtitle"></div></div></div></section>
<section class="slide" onclick="revealNextCard()"><div class="cards-page"><div class="element-row"><div class="element-card" data-no="01"><b>认知</b></div><div class="element-card" data-no="02"><b>激情</b></div><div class="element-card" data-no="03"><b>行动</b></div><div class="element-card" data-no="04"><b>团队</b></div></div></div></section>
<section class="slide" onclick="advanceTagStage()"><div class="tag-page"><div class="tag-cloud" id="tagCloud"><div class="big-overlay" id="bigOverlay"><b>帮你做任何事</b></div></div><div class="gold-quote" id="goldQuote">做任何事之前都先问一句：<span>AI 能否帮到我？</span>尤其是重复型的工作。</div></div></section>
</main>
<div class="nav"><button onclick="prevSlide()">‹</button><div class="page"><span id="pageNo">1</span>/3</div><button onclick="nextSlide()">›</button></div>
<button class="draw-toggle" onclick="enterDraw()">标注</button>
<div class="draw-tools"><button class="swatch" style="background:#ff3b30" onclick="setPen('#ff3b30')"></button><button class="swatch" style="background:#ffd60a" onclick="setPen('#ffd60a')"></button><button class="swatch" style="background:#30d158" onclick="setPen('#30d158')"></button><button class="clear" onclick="clearDraw()">清空</button><button class="clear" onclick="exitDraw()">退出</button></div>
<script>
const slides=Array.from(document.querySelectorAll('.slide'));let current=0;let typed=false;let typingTimer=null;let cardIndex=0;let tagStage=0;const pageNo=document.getElementById('pageNo');
function showSlide(i){slides[current].classList.remove('active');current=(i+slides.length)%slides.length;slides[current].classList.add('active');pageNo.textContent=current+1;clearDraw();if(current===1)resetCards();if(current===2)resetTagStage()}
function nextSlide(){showSlide(current+1)}function prevSlide(){showSlide(current-1)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')nextSlide();if(e.key==='ArrowLeft')prevSlide();if(e.key==='f'||e.key==='F')toggleFullscreen()});
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}}
function startTyping(){if(typed)return;typed=true;const text='AI 可能是我们普通人最好的机遇，前提是，你需要掌握驾驭 AI 的方法。';const el=document.getElementById('subtitle');el.classList.add('typing');let i=1;clearInterval(typingTimer);typingTimer=setInterval(()=>{el.textContent=text.slice(0,i);i++;if(i>text.length+1){clearInterval(typingTimer);setTimeout(()=>el.classList.remove('typing'),500)}},38)}
function resetCards(){cardIndex=0;document.querySelectorAll('.element-card').forEach(c=>c.classList.remove('show'))}
function revealNextCard(){if(current!==1)return;const cards=document.querySelectorAll('.element-card');if(cardIndex>=cards.length)return;cards[cardIndex].classList.add('show');cardIndex++}
const tags=['写材料','市场洞察','做调研','写原型','写 PRD','画流程图','竞品分析','会议纪要','用户访谈','需求池整理','数据复盘','日报周报','项目排期','风险清单','测试用例','验收报告','产品汇报','培训课件','客户回复','老板汇报','文档润色','资料归档','知识库整理','需求评审','功能清单','运营活动','增长分析','用户分层','商业计划','建设方案'];
const cloud=document.getElementById('tagCloud');tags.forEach((t,i)=>{const el=document.createElement('div');el.className='tag';el.textContent=t;const x=4+(i%6)*15.5+((i*7)%5);const y=8+Math.floor(i/6)*16+((i*11)%6);el.style.left=x+'%';el.style.top=y+'%';el.style.setProperty('--r',(-8+(i*13)%17)+'deg');el.style.setProperty('--d',(2.6+(i%5)*.45)+'s');el.style.animationDelay=(-(i%7)*.2)+'s';cloud.appendChild(el)});
function resetTagStage(){tagStage=0;document.querySelectorAll('.tag').forEach(t=>t.classList.remove('show'));document.getElementById('bigOverlay').classList.remove('show');document.getElementById('goldQuote').classList.remove('show')}
function showTags(count){document.querySelectorAll('.tag').forEach((t,i)=>{if(i<count)t.classList.add('show')})}
function advanceTagStage(){if(current!==2)return;if(tagStage===0)showTags(1);else if(tagStage===1)showTags(4);else if(tagStage===2)showTags(tags.length);else if(tagStage===3)document.getElementById('bigOverlay').classList.add('show');else if(tagStage===4)document.getElementById('goldQuote').classList.add('show');tagStage=Math.min(tagStage+1,5)}
const canvas=document.getElementById('drawCanvas'),ctx=canvas.getContext('2d');let drawing=false,pen='#ff3b30';
function resizeCanvas(){const dpr=devicePixelRatio||1;canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round'}resizeCanvas();addEventListener('resize',resizeCanvas);
function enterDraw(){document.body.classList.add('drawing')}function setPen(c){pen=c;enterDraw()}function exitDraw(){drawing=false;document.body.classList.remove('drawing')}
function pos(e){return{x:e.clientX,y:e.clientY}}canvas.addEventListener('pointerdown',e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle=pen;ctx.lineWidth=4;ctx.lineTo(p.x,p.y);ctx.stroke()});addEventListener('pointerup',()=>drawing=false);function clearDraw(){ctx.clearRect(0,0,canvas.width,canvas.height)}
</script>
</body>
</html>
