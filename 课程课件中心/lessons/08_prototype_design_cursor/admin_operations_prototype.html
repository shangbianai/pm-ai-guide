<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityCup 后台运营原型</title>
  <style>
    :root{
      --bg:#f4f6fb;--paper:#fff;--ink:#101828;--text:#344054;--soft:#667085;--muted:#98a2b3;--line:#e4e7ec;
      --nav:#111827;--nav2:#182230;--blue:#2563eb;--cyan:#0891b2;--green:#16a34a;--amber:#d97706;--rose:#e11d48;--violet:#7c3aed;
      --shadow:0 20px 60px rgba(15,23,42,.11)
    }
    *{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select,textarea{font-family:inherit}.hidden{display:none!important}
    .fidelity{position:fixed;right:22px;top:18px;z-index:120;display:flex;gap:6px;border:1px solid rgba(17,24,39,.10);border-radius:999px;background:rgba(255,255,255,.90);padding:5px;box-shadow:0 14px 32px rgba(15,23,42,.10);backdrop-filter:blur(14px)}
    .fidelity button{border:0;border-radius:999px;background:transparent;padding:9px 14px;color:#475467;font-weight:950;cursor:pointer}.fidelity button.active{background:#111827;color:white}

    .auth{min-height:100vh;display:grid;grid-template-columns:minmax(520px,1.08fr) minmax(440px,.92fr);align-items:center;gap:42px;padding:48px;background:radial-gradient(760px 520px at 0 0,rgba(37,99,235,.14),transparent 60%),radial-gradient(760px 520px at 100% 100%,rgba(22,163,74,.13),transparent 58%),linear-gradient(180deg,#fbfdff,#edf2f8)}
    .auth.hide{display:none}.brand-canvas{min-height:690px;border-radius:34px;background:#0b1220;color:white;position:relative;overflow:hidden;padding:42px;box-shadow:var(--shadow);isolation:isolate}
    .brand-canvas:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(180deg,black,transparent 92%);z-index:-2}
    .brand-canvas:after{content:"";position:absolute;right:-170px;top:-180px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.42),rgba(6,182,212,.18),transparent 70%);z-index:-1}
    .brand-top{display:flex;align-items:center;gap:13px;font-size:24px;font-weight:950}.logo-mark{width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,#2563eb,#16a34a);display:grid;place-items:center;box-shadow:0 14px 32px rgba(37,99,235,.28)}
    .brand-canvas h1{font-size:58px;line-height:1.04;letter-spacing:-.035em;margin:92px 0 18px;max-width:760px}.brand-canvas p{font-size:20px;line-height:1.65;color:rgba(255,255,255,.74);max-width:690px;margin:0}
    .ops-board{position:absolute;left:42px;right:42px;bottom:38px;display:grid;grid-template-columns:1.05fr .95fr;gap:16px}.ops-card{border:1px solid rgba(255,255,255,.16);border-radius:24px;background:rgba(255,255,255,.09);backdrop-filter:blur(14px);padding:18px}
    .mini-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.mini-kpis div{border-radius:16px;background:rgba(255,255,255,.10);padding:14px}.mini-kpis b{display:block;font-size:25px}.mini-kpis span{font-size:12px;color:rgba(255,255,255,.62)}
    .worklines{display:grid;gap:10px}.worklines div{height:36px;border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.07));position:relative;overflow:hidden}.worklines div:after{content:"";position:absolute;left:14px;top:12px;width:44%;height:12px;border-radius:999px;background:rgba(255,255,255,.30)}.worklines div:nth-child(2):after{width:62%}.worklines div:nth-child(3):after{width:34%}
    .login-card{width:min(560px,100%);justify-self:center;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);padding:32px}.login-card h2{font-size:32px;margin:0 0 8px}.login-card>p{margin:0 0 22px;color:var(--soft);line-height:1.65}
    .auth-tabs{display:flex;gap:8px;background:#f2f4f7;border-radius:999px;padding:6px;margin-bottom:22px}.auth-tabs button{flex:1;border:0;border-radius:999px;background:transparent;padding:11px;font-weight:950;color:#667085;cursor:pointer}.auth-tabs button.active{background:white;color:#101828;box-shadow:0 10px 24px rgba(15,23,42,.08)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:950;color:#344054;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;border-radius:12px;background:white;padding:11px 12px;font-size:14px;outline:none}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.10)}
    .primary{width:100%;border:0;border-radius:15px;background:linear-gradient(135deg,#1d4ed8,#0891b2);color:white;font-weight:950;padding:14px;cursor:pointer;box-shadow:0 14px 28px rgba(37,99,235,.22)}.login-tip{margin-top:14px;color:var(--soft);font-size:13px;line-height:1.55}

    .app{display:none;min-height:100vh;grid-template-columns:272px 1fr;transition:.2s}.app.show{display:grid}.app.collapsed{grid-template-columns:78px 1fr}
    .sidebar{background:var(--nav);color:white;min-height:100vh;position:sticky;top:0;align-self:start;display:flex;flex-direction:column;box-shadow:8px 0 26px rgba(15,23,42,.08)}
    .side-top{height:70px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}.side-logo{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:980;min-width:0}.side-logo span{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#16a34a);display:grid;place-items:center;flex:0 0 auto}.side-name{white-space:nowrap;overflow:hidden}.collapse-btn{margin-left:auto;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:white;border-radius:11px;width:34px;height:34px;cursor:pointer;font-weight:950}
    .side-scroll{padding:14px 12px;overflow:auto;flex:1}.side-section{margin:10px 0 18px}.side-title{font-size:11px;color:#8ba0bc;font-weight:950;letter-spacing:.12em;margin:0 0 8px 12px}.side-btn{width:100%;height:42px;border:0;border-radius:12px;background:transparent;color:#cbd5e1;padding:0 12px;text-align:left;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px}.side-btn i{font-style:normal;width:22px;text-align:center;color:#94a3b8;flex:0 0 auto}.side-btn.active{background:rgba(255,255,255,.11);color:white}.side-btn.active i{color:#60a5fa}.side-foot{margin:0 14px 16px;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:13px;color:#cbd5e1;background:rgba(255,255,255,.06);font-size:13px;line-height:1.55}
    .app.collapsed .side-name,.app.collapsed .side-title,.app.collapsed .side-btn span,.app.collapsed .side-foot{display:none}.app.collapsed .side-top{justify-content:center;padding:0}.app.collapsed .side-logo{gap:0}.app.collapsed .collapse-btn{position:absolute;left:22px;bottom:18px;margin:0}.app.collapsed .side-scroll{padding:14px 10px}.app.collapsed .side-section{margin:10px 0}.app.collapsed .side-btn{justify-content:center;padding:0}.app.collapsed .side-btn i{width:auto}

    .main{min-width:0;padding:22px 30px 50px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px;padding-right:180px}.crumb{font-size:13px;color:var(--soft);margin-bottom:8px}.top h1{font-size:30px;margin:0}.top p{margin:7px 0 0;color:var(--soft);line-height:1.55}.top-actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid #d0d5dd;border-radius:10px;background:white;padding:9px 12px;font-weight:900;color:#344054;cursor:pointer}.btn:hover{border-color:#98a2b3}.btn.dark{border-color:#111827;background:#111827;color:white}.btn.blue{border:0;background:#2563eb;color:white}.btn.green{border:0;background:#16a34a;color:white}.btn.ghost{background:#f9fafb}.btn.warn{border:0;background:#d97706;color:white}.btn.rose{border:0;background:#e11d48;color:white}
    .dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.metric-card{border:1px solid var(--line);border-radius:18px;background:white;padding:16px;box-shadow:0 8px 22px rgba(15,23,42,.04)}.metric-card span{color:var(--soft);font-size:12px}.metric-card b{display:block;font-size:25px;margin-top:8px}.metric-card small{display:block;margin-top:6px;color:#16a34a;font-weight:900}.metric-card small.down{color:#e11d48}
    .dash-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:14px}.panel{border:1px solid var(--line);border-radius:16px;background:white;padding:16px;box-shadow:0 8px 22px rgba(15,23,42,.04)}.panel h3{margin:0 0 12px;font-size:17px}.chart{height:220px;display:flex;align-items:end;gap:12px;padding:14px;border:1px solid #eef2f7;border-radius:14px;background:linear-gradient(180deg,#fff,#f8fafc)}.bar{flex:1;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#2563eb,#06b6d4);min-height:30px}.summary-list{display:grid;gap:10px}.summary-list div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid #eef2f7;border-radius:12px;padding:11px 12px}.summary-list b{font-size:14px}.summary-list span{color:var(--soft);font-size:13px}.summary-list em{font-style:normal;color:#2563eb;font-weight:950}
    .module-shell{display:grid;gap:14px}.module-tabs{display:flex;gap:8px;align-items:center;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:10px}.tab{border:0;border-radius:999px;background:#eef2f7;color:#475467;padding:9px 13px;font-weight:950;white-space:nowrap;cursor:pointer}.tab.active{background:#111827;color:white}.action-strip{border:1px solid var(--line);border-radius:16px;background:white;padding:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 8px 22px rgba(15,23,42,.04)}.action-left,.action-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{width:300px;max-width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px}.select{border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px;background:white;color:#344054}
    .split{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}.split>div{min-width:0}.split .table{min-width:820px}.split .search{width:260px}.category-panel{border:1px solid var(--line);border-radius:16px;background:white;padding:12px;box-shadow:0 8px 22px rgba(15,23,42,.04)}.category-panel h3{margin:4px 8px 12px;font-size:16px}.cat-btn{width:100%;border:0;border-radius:12px;background:transparent;text-align:left;padding:11px 12px;color:#475467;font-weight:900;cursor:pointer}.cat-btn.active{background:#eff6ff;color:#1d4ed8}.cat-btn small{float:right;color:#98a2b3}
    .table-card{border:1px solid var(--line);border-radius:16px;background:white;overflow:hidden;box-shadow:0 8px 22px rgba(15,23,42,.04)}.table-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}.table-head b{font-size:17px}.table-head span{color:var(--soft);font-size:13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:980px}.table th,.table td{border-bottom:1px solid #f2f4f7;padding:12px 13px;text-align:left;font-size:13px;white-space:nowrap}.table th{background:#f9fafb;color:#667085;font-size:12px}.table tbody tr{cursor:pointer}.table tbody tr:hover td{background:#f8fbff}.cell-title{font-weight:950;color:#111827}.sub{display:block;color:#98a2b3;font-size:12px;margin-top:4px}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:950;background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.rose{background:#ffe4e6;color:#be123c}.badge.blue{background:#dbeafe;color:#1d4ed8}.badge.gray{background:#f2f4f7;color:#475467}.pagination{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:var(--soft);font-size:13px;background:#fff}
    .resource-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.resource-card{border:1px solid var(--line);border-radius:16px;background:white;padding:14px;box-shadow:0 8px 22px rgba(15,23,42,.04);cursor:pointer}.resource-card .thumb{height:84px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#0891b2,#16a34a);margin-bottom:12px}.resource-card h4{margin:0 0 6px}.resource-card p{margin:0;color:var(--soft);font-size:13px}
    .order-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.step-card{border:1px solid var(--line);border-radius:14px;background:white;padding:13px;box-shadow:0 8px 22px rgba(15,23,42,.04)}.step-card b{display:block;font-size:22px;margin-top:6px}.step-card span{font-size:13px;color:var(--soft)}
    .member-layout{display:grid;grid-template-columns:1fr 320px;gap:14px}.segment-card{border:1px solid var(--line);border-radius:16px;background:white;padding:14px;box-shadow:0 8px 22px rgba(15,23,42,.04);margin-bottom:12px}.segment-card h4{margin:0 0 8px}.segment-card p{margin:0;color:var(--soft);font-size:13px;line-height:1.55}
    .store-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.store-card{border:1px solid var(--line);border-radius:16px;background:white;padding:14px;box-shadow:0 8px 22px rgba(15,23,42,.04);cursor:pointer}.store-card h4{margin:0 0 8px}.store-card p{margin:0;color:var(--soft);font-size:13px;line-height:1.6}.store-card footer{display:flex;justify-content:space-between;margin-top:12px;color:#475467;font-size:13px;font-weight:900}
    .settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.setting-card{border:1px solid var(--line);border-radius:16px;background:white;padding:16px;box-shadow:0 8px 22px rgba(15,23,42,.04);cursor:pointer}.setting-card h4{margin:0 0 8px}.setting-card p{margin:0 0 14px;color:var(--soft);font-size:13px;line-height:1.55}
    .drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.20);opacity:0;pointer-events:none;transition:.2s;z-index:90}.drawer-mask.open{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;bottom:0;width:500px;background:white;border-left:1px solid var(--line);box-shadow:-24px 0 70px rgba(15,23,42,.16);transform:translateX(105%);transition:.25s;z-index:100;display:flex;flex-direction:column}.drawer.open{transform:none}.drawer-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.drawer-head h3{margin:0;font-size:22px}.drawer-head p{margin:6px 0 0;color:#667085}.drawer-body{padding:20px;overflow:auto}.kv{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #f2f4f7}.kv span{color:var(--soft)}.kv b{font-weight:900}.detail-section{margin-top:18px}.detail-section h4{margin:0 0 10px;font-size:15px}.timeline{display:grid;gap:10px}.timeline div{border-left:3px solid #dbeafe;padding-left:12px;color:#475467;line-height:1.55}.drawer-actions{margin-top:auto;border-top:1px solid var(--line);padding:16px 20px;display:flex;gap:10px}.drawer-actions .btn{flex:1}.module-form{display:grid;gap:12px;margin-top:8px}.module-form .form-grid{grid-template-columns:1fr 1fr}
    body.low{filter:grayscale(1)}body.low .brand-canvas,body.low .login-card,body.low .metric-card,body.low .panel,body.low .action-strip,body.low .table-card,body.low .category-panel,body.low .resource-card,body.low .step-card,body.low .segment-card,body.low .store-card,body.low .setting-card,body.low .drawer{box-shadow:none!important;background:white!important;background-image:none!important;border:1.5px solid #111827!important}body.low .brand-canvas{color:#111827}body.low .brand-canvas p{color:#475467}body.low .ops-card{border-color:#111827;background:white;color:#111827}body.low .sidebar{background:white;color:#111827;border-right:1.5px solid #111827}body.low .side-title,body.low .side-btn,body.low .side-foot,body.low .side-btn i,body.low .collapse-btn{color:#111827}body.low .side-btn.active{border:1px solid #111827;background:#f8fafc}body.low .btn.dark,body.low .btn.blue,body.low .btn.green,body.low .btn.warn,body.low .btn.rose,body.low .primary{background:#111827!important;color:white!important}
    @media(max-width:1180px){.auth,.app.show{grid-template-columns:1fr}.app.collapsed{grid-template-columns:1fr}.sidebar{position:relative;min-height:auto}.top{padding-right:0}.dashboard-grid,.dash-layout,.split,.member-layout,.store-grid,.settings-grid,.resource-grid,.order-steps{grid-template-columns:1fr}.drawer{width:min(500px,100%)}.brand-canvas{min-height:560px}.ops-board{position:relative;left:auto;right:auto;bottom:auto;margin-top:40px}.fidelity{position:absolute}}
  </style>
</head>
<body>
  <div class="fidelity"><button class="active" data-mode="high">高保真</button><button data-mode="low">低保真</button></div>

  <section class="auth" id="auth">
    <div class="brand-canvas">
      <div class="brand-top"><span class="logo-mark">C</span> CityCup Admin</div>
      <h1>把门店、商品、订单和会员运营放进一个后台</h1>
      <p>这是一套面向咖啡连锁业务的运营后台原型：总部看经营，门店看履约，运营配置活动，会员团队做增长。</p>
      <div class="ops-board">
        <div class="ops-card"><strong>今日经营快照</strong><div class="mini-kpis"><div><b>1,284</b><span>支付订单</span></div><div><b>42</b><span>制作中</span></div><div><b>18.4%</b><span>活动 CTR</span></div></div></div>
        <div class="ops-card"><strong>待处理工作</strong><div class="worklines"><div></div><div></div><div></div></div></div>
      </div>
    </div>
    <div class="login-card">
      <h2>登录运营后台</h2>
      <p>使用总部运营账号进入工作台，管理活动、商品、订单、会员和门店。</p>
      <div class="auth-tabs"><button class="active" data-auth-tab="login">账号登录</button><button data-auth-tab="register">注册试用</button></div>
      <div id="loginForm">
        <div class="field"><label>账号</label><input value="ops@citycup.cn"></div>
        <div class="field"><label>密码</label><input type="password" value="123456"></div>
        <div class="form-grid"><div class="field"><label>组织</label><select><option>CityCup 总部</option><option>华东大区</option><option>深圳大区</option></select></div><div class="field"><label>角色</label><select><option>总部运营</option><option>门店店长</option><option>会员运营</option></select></div></div>
        <button class="primary" id="enter">进入管理台</button>
        <p class="login-tip">账号已预填，点击即可进入完整后台原型。</p>
      </div>
      <div id="registerForm" class="hidden">
        <div class="field"><label>公司名称</label><input placeholder="例如：CityCup Coffee"></div>
        <div class="field"><label>管理员手机号</label><input placeholder="请输入手机号"></div>
        <div class="form-grid"><div class="field"><label>门店数量</label><select><option>1-10 家</option><option>11-50 家</option><option>50 家以上</option></select></div><div class="field"><label>业务类型</label><select><option>咖啡茶饮</option><option>轻食烘焙</option><option>综合零售</option></select></div></div>
        <button class="primary">创建试用后台</button>
      </div>
    </div>
  </section>

  <section class="app" id="app">
    <aside class="sidebar">
      <div class="side-top"><div class="side-logo"><span>C</span><div class="side-name">CityCup Admin</div></div><button class="collapse-btn" id="collapseBtn">‹</button></div>
      <div class="side-scroll" id="side"></div>
      <div class="side-foot"><b>当前门店组</b><br>总部全量视图 · 38 家门店<br>数据更新时间 09:42</div>
    </aside>
    <main class="main">
      <div class="top">
        <div><div class="crumb" id="crumb">工作台 / 运营总览</div><h1 id="title">运营总览</h1><p id="desc"></p></div>
        <div class="top-actions" id="topActions"></div>
      </div>
      <div id="content"></div>
    </main>
  </section>

  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head"><div><h3 id="drawerTitle"></h3><p id="drawerSub"></p></div><button class="btn" id="closeDrawer">关闭</button></div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-actions"><button class="btn dark">保存修改</button><button class="btn">添加备注</button></div>
  </aside>

  <script>
    const nav=[
      ['工作台',[['dashboard','▦','运营总览'],['tasks','✓','待办中心']]],
      ['运营管理',[['campaign','◈','活动配置'],['products','☕','商品管理'],['orders','▣','订单履约'],['members','◇','会员运营'],['stores','⌂','门店管理']]],
      ['系统配置',[['settings','⚙','系统设置']]]
    ];

    function renderStores(){setTop('<button class="btn">批量公告</button><button class="btn">营业时间</button><button class="btn dark">新增门店</button>');content.innerHTML=`<div class="module-shell">${tabs(['全部','营业中','忙碌','闭店','装修中'])}<div class="store-grid">${datasets.stores.rows.slice(0,6).map((s,i)=>`<div class="store-card" data-store="${i}"><h4>${s[0]}</h4><p>${s[1]} · ${s[2]}<br>预计取餐 ${s[3]} · 店长 ${s[6]}</p><footer><span>今日订单 ${s[4]}</span><span class="badge ${statusClass(s[2])}">${s[2]}</span></footer></div>`).join('')}</div>${actionStrip('stores','<button class="btn">批量改时段</button><button class="btn">发布公告</button><button class="btn dark">新增门店</button>','<select class="select"><option>全部城市</option><option>杭州</option><option>上海</option><option>深圳</option></select>')}<div id="tableHolder">${tableHTML('stores',filterRows('stores'),'门店列表','营业状态、取餐能力和库存风险')}</div></div>`;bindCommon('stores');document.querySelectorAll('[data-store]').forEach((el,i)=>el.onclick=()=>openDrawer(datasets.stores.rows[i],'stores'))}
    function renderSettings(){setTop('<button class="btn">查看审计</button><button class="btn dark">新增配置</button>');content.innerHTML=`<div class="module-shell"><div class="settings-grid">${[['角色权限','管理总部、门店、财务、运营等角色边界'],['审批流程','活动、退款、商品上下架审核流'],['消息模板','短信、站内信、取餐码与库存预警'],['基础规则','积分、券包、库存安全线和门店配置'],['安全审计','登录记录、敏感操作和数据导出'],['系统集成','POS、库存、支付和会员中台接口']].map((x,i)=>`<div class="setting-card" data-setting="${i}"><h4>${x[0]}</h4><p>${x[1]}</p><button class="btn">进入配置</button></div>`).join('')}</div>${actionStrip('settings','<button class="btn">导出审计</button><button class="btn dark">新增配置</button>','<select class="select"><option>全部类型</option><option>权限</option><option>流程</option><option>消息</option></select>')}<div id="tableHolder">${tableHTML('settings',filterRows('settings'),'配置列表','权限、流程、模板和审计配置')}</div></div>`;bindCommon('settings');document.querySelectorAll('[data-setting]').forEach((el,i)=>el.onclick=()=>openDrawer(datasets.settings.rows[i]||datasets.settings.rows[0],'settings'))}
    function render(){renderSide();({dashboard:renderDashboard,tasks:renderTasks,campaign:renderCampaign,products:renderProducts,orders:renderOrders,members:renderMembers,stores:renderStores,settings:renderSettings}[active])()}
    function openDrawer(row,key){const ds=datasets[key]||datasets.tasks;const data=row||['新建记录','待填写','草稿','未分配','-','今天'];document.getElementById('drawerTitle').textContent=data[0];document.getElementById('drawerSub').textContent=`${meta[key]?.[1]||'业务'} · 详情与编辑`;document.getElementById('drawerBody').innerHTML=`${ds.columns.map((c,i)=>`<div class="kv"><span>${c}</span><b>${data[i]||'-'}</b></div>`).join('')}<div class="detail-section"><h4>编辑表单</h4><div class="module-form"><div class="form-grid"><div class="field"><label>当前状态</label><select><option>${data[2]||'待审核'}</option><option>上线中</option><option>待审核</option><option>待处理</option><option>已完成</option><option>异常</option></select></div><div class="field"><label>负责人</label><input value="${data[3]||'运营负责人'}"></div></div><div class="field"><label>处理备注</label><textarea>补充运营判断、处理动作和下一步跟进事项。</textarea></div></div></div><div class="detail-section"><h4>处理记录</h4><div class="timeline"><div><b>09:42</b> 系统同步最新数据，生成提醒。</div><div><b>09:28</b> 运营负责人查看并添加处理备注。</div><div><b>昨天</b> 记录由相关业务模块自动创建。</div></div></div>`;document.getElementById('drawer').classList.add('open');document.getElementById('drawerMask').classList.add('open')}
    function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerMask').classList.remove('open')}
    document.querySelectorAll('[data-auth-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-auth-tab]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('loginForm').classList.toggle('hidden',btn.dataset.authTab!=='login');document.getElementById('registerForm').classList.toggle('hidden',btn.dataset.authTab!=='register')});
    function enterApp(){document.getElementById('auth').classList.add('hide');app.classList.add('show');render()}
    document.getElementById('enter').onclick=enterApp;document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('drawerMask').onclick=closeDrawer;document.getElementById('collapseBtn').onclick=()=>{app.classList.toggle('collapsed');document.getElementById('collapseBtn').textContent=app.classList.contains('collapsed')?'›':'‹'};
    document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.body.classList.toggle('low',btn.dataset.mode==='low')});
    if(location.hash.startsWith('#app-')&&!['#app-low'].includes(location.hash)){const target=location.hash.replace('#app-','');if(meta[target])active=target;enterApp();if(target==='collapsed')app.classList.add('collapsed')}
    if(location.hash==='#app'){enterApp()} if(location.hash==='#low'){document.querySelector('[data-mode="low"]').click()} if(location.hash==='#app-low'){document.querySelector('[data-mode="low"]').click();enterApp()}
  </script>
</body>
</html>
