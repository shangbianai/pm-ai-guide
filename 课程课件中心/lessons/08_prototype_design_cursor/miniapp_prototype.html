<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityCup 小程序原型</title>
  <style>
    :root{--bg:#eef4ff;--ink:#101827;--soft:#667085;--line:rgba(16,24,39,.12);--blue:#2563eb;--cyan:#06b6d4;--mint:#22c55e;--amber:#f59e0b;--rose:#fb7185;--shadow:0 30px 92px rgba(15,23,42,.18)}
    *{box-sizing:border-box}html,body{margin:0;padding:0}
    body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(760px 520px at 0 0,rgba(37,99,235,.16),transparent 60%),radial-gradient(740px 520px at 100% 0,rgba(34,197,94,.14),transparent 62%),linear-gradient(180deg,#f8fbff,#e8eef7);color:var(--ink);overflow:hidden}
    .mode{position:fixed;right:24px;top:22px;z-index:20;display:flex;gap:8px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.9);padding:6px;box-shadow:0 16px 38px rgba(15,23,42,.12)}
    button{font-family:inherit;cursor:pointer}.mode button{border:0;border-radius:999px;background:transparent;color:#475467;font-weight:950;padding:10px 14px}.mode button.active{background:#101827;color:white}
    .layout{height:100vh;display:grid;grid-template-columns:320px 1fr;transition:.28s}.layout.closed{grid-template-columns:92px 1fr}
    .drawer{position:relative;margin:24px 0 24px 24px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.9);box-shadow:var(--shadow);overflow:hidden;transition:.28s}
    .drawer-head{height:78px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}.logo{width:38px;min-width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--mint));display:grid;place-items:center;color:white;font-weight:980}.title{font-size:21px;font-weight:980;white-space:nowrap}.title span{background:linear-gradient(120deg,var(--blue),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}.layout.closed .title,.layout.closed .group-title,.layout.closed .nav span,.layout.closed .nav small{display:none}
    .collapse{position:absolute;right:12px;top:18px;border:1px solid var(--line);width:38px;height:38px;border-radius:14px;background:white;color:#334155;font-weight:980}.layout.closed .drawer-head{justify-content:center;padding:0;border-bottom:1px solid var(--line)}.layout.closed .logo{display:none}.layout.closed .collapse{position:static}
    .nav{padding:16px;display:grid;gap:8px;max-height:calc(100vh - 112px);overflow:auto}.group-toggle{width:100%;border:1px solid transparent;border-radius:18px;background:transparent;color:#344054;padding:13px 12px;text-align:left;font-weight:980;display:grid;grid-template-columns:36px 1fr 18px;gap:12px;align-items:center}.group-toggle span{white-space:nowrap}.group-toggle b{justify-self:end;color:#667085;font-size:15px}.group-toggle i,.nav button i{font-style:normal;width:36px;min-width:36px;height:36px;border-radius:14px;background:#f1f5f9;display:grid;place-items:center}.group-toggle.open{background:#f8fafc;border-color:#e5e7eb}.group-toggle.open i{background:linear-gradient(135deg,var(--blue),var(--cyan));color:white}.subnav{display:grid;gap:5px;margin:4px 0 8px 50px}.nav button{width:100%;border:1px solid transparent;border-radius:13px;background:transparent;color:#667085;padding:9px 12px;text-align:left;font-weight:950;display:block}.nav button.active{background:#eef2ff;color:#4f46e5}.layout.closed .nav{padding:12px 10px;gap:12px;justify-items:center;overflow:hidden}.layout.closed .nav > div{display:grid;gap:12px}.layout.closed .group-toggle{width:48px;height:48px;padding:0;display:grid;place-items:center;border-radius:18px;grid-template-columns:1fr}.layout.closed .group-toggle span,.layout.closed .group-toggle b,.layout.closed .subnav{display:none}.layout.closed .group-toggle i{margin:0}.layout.closed .group-toggle.open i{background:linear-gradient(135deg,var(--blue),var(--cyan));color:white}
    .stage{display:grid;place-items:center;justify-items:center;min-width:0;padding:40px 96px 40px 24px}.layout.closed .stage{padding-left:0}.iphone{position:relative;width:400px;height:852px;border-radius:66px;padding:10px;background:linear-gradient(145deg,#f8fafc,#7d8999 36%,#172033 58%,#fbfdff 92%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.78),inset 0 0 0 4px rgba(15,23,42,.18),0 34px 92px rgba(15,23,42,.34)}
    .iphone:before{content:"";position:absolute;left:-4px;top:160px;width:4px;height:76px;border-radius:6px 0 0 6px;background:#7f8da0;box-shadow:0 94px 0 #7f8da0}.iphone:after{content:"";position:absolute;right:-4px;top:218px;width:4px;height:120px;border-radius:0 6px 6px 0;background:#6b7788}.bezel{height:100%;border-radius:56px;background:#05070d;padding:7px}.screen{position:relative;height:100%;border-radius:49px;background:#f8fafc;overflow:hidden;display:flex;flex-direction:column}.island{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:110px;height:32px;border-radius:999px;background:#05070d;z-index:6}.capsule{position:absolute;right:17px;top:55px;z-index:7;width:86px;height:32px;border:1px solid rgba(16,24,39,.10);border-radius:999px;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:space-around;box-shadow:0 8px 20px rgba(15,23,42,.08)}.capsule span:first-child{font-size:18px;line-height:0}.capsule span:last-child{width:16px;height:16px;border:2px solid #101827;border-radius:50%}
    .status{position:relative;height:56px;font-size:12px;font-weight:950}.status span:first-child{position:absolute;left:24px;top:24px}.status span:last-child{position:absolute;right:70px;top:24px}.head{padding:0 22px 13px}.head h1{font-size:24px;margin:0 0 5px}.head p{font-size:12px;color:var(--soft);margin:0}.content{flex:1;overflow:auto;padding:0 18px 14px}.tabbar{height:72px;border-top:1px solid #e5e7eb;background:rgba(255,255,255,.9);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px}.tabbar button{border:0;background:transparent;color:#98a2b3;font-size:11px;font-weight:950;padding:4px}.tabbar b{display:block;font-size:20px;line-height:1.1}.tabbar button.active{color:#1d4ed8;position:relative}.tabbar button.active:after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:22px;height:3px;border-radius:99px;background:#2563eb}
    .carousel{position:relative;height:172px;border-radius:28px;overflow:hidden;color:white;background:#111827;padding:20px;display:flex;flex-direction:column;justify-content:end;box-shadow:0 18px 42px rgba(37,99,235,.24)}.asset{background-image:url("assets/citycup-assets.png");background-repeat:no-repeat;background-size:320% 250%}.banner0{background-position:0% 0%}.banner1{background-position:50% 0%}.banner2{background-position:100% 0%}.carousel:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.48))}.carousel h2,.carousel p{position:relative;text-shadow:0 2px 12px rgba(0,0,0,.22)}.carousel h2{margin:0;font-size:25px}.carousel p{margin:6px 0 0;color:rgba(255,255,255,.86);font-size:12px}.dots{position:absolute;right:20px;bottom:16px;display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}.dots i.active{width:18px;border-radius:999px;background:white}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 10px}.section-title b{font-size:15px;white-space:nowrap}.link{border:0;background:transparent;color:#1d4ed8;font-size:12px;font-weight:950;padding:0}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.quick{min-width:0;border:1px solid #e5e7eb;border-radius:19px;background:white;padding:11px 4px;text-align:center;box-shadow:0 10px 24px rgba(15,23,42,.05);display:grid;justify-items:center;align-content:center}.quick .asset-icon{width:34px;height:34px;border-radius:12px;margin-bottom:6px;background-image:url("assets/citycup-assets.png");background-size:760% 420%;background-repeat:no-repeat}.i-pick{background-position:0% 100%}.i-fast{background-position:17% 100%}.i-gift{background-position:34% 100%}.i-store{background-position:51% 100%}.quick span{font-size:11px;color:#344054;font-weight:950;white-space:nowrap;line-height:1.1;display:block}
    .product-row{display:flex;gap:12px;overflow:hidden}.product-card{min-width:143px;border:1px solid #e5e7eb;border-radius:22px;background:white;padding:11px;box-shadow:0 12px 28px rgba(15,23,42,.06)}.art{height:102px;border-radius:18px;margin-bottom:10px;display:grid;place-items:center;background:linear-gradient(145deg,#dbeafe,#dcfce7);overflow:hidden}.product-card b{display:block;font-size:13px}.product-card span{display:block;font-size:11px;color:var(--soft);margin-top:4px}.price{color:#e11d48!important;font-size:15px!important;font-weight:950!important}.coffee{width:58px;height:74px;border-radius:18px 18px 25px 25px;background:linear-gradient(180deg,#fff,#e0f2fe);border:3px solid rgba(15,23,42,.12);position:relative}.coffee:before{content:"";position:absolute;left:8px;right:8px;top:8px;height:18px;border-radius:999px;background:#7c2d12}.coffee:after{content:"";position:absolute;right:-18px;top:24px;width:22px;height:25px;border:4px solid rgba(255,255,255,.8);border-left:0;border-radius:0 16px 16px 0}.beans{width:82px;height:82px;border-radius:25px;background:linear-gradient(135deg,#92400e,#f59e0b);position:relative}.beans:before,.beans:after{content:"";position:absolute;width:28px;height:42px;border-radius:50%;background:#451a03}.beans:before{left:17px;top:19px;transform:rotate(24deg)}.beans:after{right:16px;bottom:16px;transform:rotate(-22deg)}.cake{width:88px;height:64px;border-radius:18px;background:linear-gradient(180deg,#fecdd3,#fb7185);position:relative}.cake:before{content:"";position:absolute;left:8px;right:8px;top:-12px;height:24px;border-radius:50%;background:#fff1f2}.cake:after{content:"";position:absolute;left:12px;right:12px;bottom:13px;height:7px;border-radius:999px;background:#be123c}
    .menu-layout{display:grid;grid-template-columns:82px 1fr;gap:12px}.cats{display:grid;gap:8px;align-content:start}.cat{border:1px solid #e5e7eb;border-radius:15px;background:white;padding:10px 7px;font-size:11px;text-align:center;color:#667085;font-weight:950}.cat.active{background:#101827;color:white}.items{display:grid;gap:10px}.menu-item{display:grid;grid-template-columns:78px 1fr;gap:10px;border:1px solid #e5e7eb;border-radius:20px;background:white;padding:10px}.menu-item .art{height:72px;margin:0}.menu-item h4{margin:3px 0 4px;font-size:14px}.menu-item p{margin:0;color:var(--soft);font-size:11px;line-height:1.35}.add{float:right;border:0;border-radius:50%;width:26px;height:26px;background:#101827;color:white;font-weight:950}
    .detail-visual{height:240px;border-radius:28px;background:linear-gradient(145deg,#dbeafe,#bbf7d0);display:grid;place-items:center;margin-bottom:15px;box-shadow:0 18px 42px rgba(37,99,235,.13)}.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid #e5e7eb;border-radius:17px;background:white;padding:11px;font-size:12px;font-weight:950}.option.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.buybar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.35fr;gap:10px;margin-top:16px}.buybar button{border:0;border-radius:18px;padding:13px;font-weight:950}.buybar button:first-child{background:#f1f5f9;color:#334155}.buybar button:last-child{background:linear-gradient(135deg,#2563eb,#06b6d4);color:white}
    .order-card,.coupon{border:1px solid #e5e7eb;border-radius:22px;background:white;padding:14px;box-shadow:0 12px 28px rgba(15,23,42,.06);margin-bottom:12px}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;background:#dcfce7;color:#166534;font-size:11px;font-weight:950}.timeline{display:grid;gap:10px;margin-top:14px}.step{display:grid;grid-template-columns:24px 1fr;gap:9px}.step i{width:22px;height:22px;border-radius:50%;background:#dbeafe;border:5px solid #2563eb}.step.done i{background:#22c55e;border-color:#bbf7d0}.step b{font-size:13px}.step span{font-size:11px;color:var(--soft)}
    .member-card{border-radius:28px;padding:18px;color:white;background:linear-gradient(135deg,#111827,#7c3aed);box-shadow:0 18px 42px rgba(124,58,237,.20)}.member-card h3{margin:0 0 4px;font-size:24px}.member-card p{margin:0;color:rgba(255,255,255,.72);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stats div{border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:10px;background:rgba(255,255,255,.10)}.coupon{display:flex;justify-content:space-between;align-items:center}.coupon b{font-size:14px}.coupon span{font-size:11px;color:var(--soft)}
    body.low{filter:grayscale(1)}body.low .screen{background:white}body.low .carousel,body.low .quick,body.low .product-card,body.low .menu-item,body.low .order-card,body.low .coupon,body.low .member-card,body.low .option,body.low .cat{background:white!important;background-image:none!important;box-shadow:none!important;color:#101827!important;border:1.5px solid #111827!important}body.low .carousel:before,body.low .carousel:after,body.low .dots,body.low .asset-icon{display:none!important}body.low .carousel h2,body.low .carousel p,body.low .member-card h3,body.low .member-card p{color:#101827!important;text-shadow:none!important}body.low .art,body.low .detail-visual{background:transparent!important;border:1.5px solid #111827!important}body.low .coffee,body.low .beans,body.low .cake{opacity:.08}.hidden{display:none}
  </style>
</head>
<body>
  <div class="mode"><button class="active" data-mode="high">高保真</button><button data-mode="low">低保真</button></div>
  <main class="layout" id="layout">
    <aside class="drawer">
      <div class="drawer-head"><div class="logo">C</div><div class="title"><span>CityCup</span></div><button class="collapse" id="collapse">‹</button></div>
      <div class="nav" id="nav"></div>
    </aside>
    <section class="stage">
      <div class="iphone"><div class="bezel"><div class="screen">
        <div class="island"></div><div class="capsule"><span>•••</span><span></span></div>
        <div class="status"><span>9:41</span><span>5G</span></div>
        <div class="head"><h1 id="pageTitle"></h1><p id="pageDesc"></p></div>
        <div class="content" id="content"></div>
        <nav class="tabbar" id="tabbar"></nav>
      </div></div></div>
    </section>
  </main>
  <script>
    const icon={coffee:`<svg viewBox="0 0 48 48"><rect x="14" y="12" width="19" height="25" rx="8" fill="#dbeafe"/><rect x="17" y="15" width="13" height="6" rx="3" fill="#92400e"/><path d="M33 20h5a6 6 0 010 12h-5" fill="none" stroke="#60a5fa" stroke-width="3"/></svg>`,bolt:`<svg viewBox="0 0 48 48"><path d="M27 4L12 27h12l-3 17 16-25H25z" fill="#f59e0b"/></svg>`,gift:`<svg viewBox="0 0 48 48"><rect x="10" y="20" width="28" height="20" rx="5" fill="#fb7185"/><path d="M24 20v20M10 27h28" stroke="#fff" stroke-width="3"/><path d="M16 17c-4-4 2-9 8 3 6-12 12-7 8-3" fill="none" stroke="#2563eb" stroke-width="3"/></svg>`,pin:`<svg viewBox="0 0 48 48"><path d="M24 43s13-12 13-25A13 13 0 1011 18c0 13 13 25 13 25z" fill="#ef4444"/><circle cx="24" cy="18" r="5" fill="#fff"/></svg>`};
    const groups=[['首页','⌂',[['home','首页推荐','活动与快捷入口'],['campaign','活动专区','轮播、券包、专题'],['store','附近门店','门店、距离、营业状态']]],['点单','☕',[['menu','菜单点单','分类、商品、加购'],['detail','商品详情','规格、加料、购买'],['cart','购物车','商品、券、结算']]],['履约','✓',[['order','订单流程','支付、制作、取餐'],['pickup','取餐码','门店取餐与提醒']]],['会员','◇',[['member','会员中心','积分、券包、权益'],['coupon','优惠券','领取、核销、过期'],['history','历史订单','复购、评价、售后']]]];
    const products={latte:['厚乳拿铁','浓缩咖啡 / 厚乳 / 可选冰热','¥21','coffee'],americano:['冰摇美式','低糖低卡 / 大杯更划算','¥15','beans'],cake:['草莓芝士卷','搭配咖啡立减 5 元','¥24','cake'],coco:['生椰拿铁','清爽椰香','¥19','coffee']};
    let active='home',openGroup='首页',banner=0,batch=0,cat='人气',cart=1;
    function art(type){return `<div class="art"><div class="${type}"></div></div>`}
    function prodCard(p){const x=products[p];return `<div class="product-card">${art(x[3])}<b>${x[0]}</b><span>${x[1]}</span><span class="price">${x[2]}</span></div>`}
    function menuItem(p){const x=products[p];return `<div class="menu-item">${art(x[3])}<div><button class="add" data-add="${p}">+</button><h4>${x[0]}</h4><p>${x[1]}</p><span class="price">${x[2]}</span></div></div>`}
    const pages={
      home:['CityCup 咖啡','附近门店 · 会员日 · 快速点单',()=>`<div class="section-title"><b>活动 Banner</b></div><div class="carousel asset banner${banner}" id="carousel"><h2>${['早安，来杯燕麦拿铁','新品草莓芝士卷上线','会员日券包限时领'][banner]}</h2><p>${['距离最近门店 320m，预计 8 分钟取餐。','搭配拿铁立减 5 元，今日限量供应。','满 30 减 8，第二杯半价，今日可用。'][banner]}</p><div class="dots">${[0,1,2].map(i=>`<i class="${i===banner?'active':''}"></i>`).join('')}</div></div><div class="section-title"><b>快捷入口</b></div><div class="quick-grid"><div class="quick"><i class="asset-icon i-pick"></i><span>自提</span></div><div class="quick"><i class="asset-icon i-fast"></i><span>快速买</span></div><div class="quick"><i class="asset-icon i-gift"></i><span>券包</span></div><div class="quick"><i class="asset-icon i-store"></i><span>门店</span></div></div><div class="section-title"><b>热门单品</b><button class="link" id="shuffle">换一批</button></div><div class="product-row">${(batch?['latte','cake']:['coco','americano']).map(prodCard).join('')}</div>`],
      campaign:['活动专区','专题、轮播、券包和会员日',()=>`<div class="carousel"><h2>会员日专属券包</h2><p>满 30 减 8、第二杯半价、甜品搭配券一次领取。</p></div><div class="section-title"><b>可领取优惠</b></div>${['满 30 减 8','第二杯半价','甜品搭配立减'].map(x=>`<div class="coupon"><b>${x}</b><span class="badge">领取</span></div>`).join('')}`],
      store:['附近门店','门店状态、距离和营业时间',()=>`<div class="order-card"><b>万象城 B1 店</b><br><span style="font-size:12px;color:#667085">320m · 营业中 · 预计 8 分钟</span></div><div class="order-card"><b>科技园北店</b><br><span style="font-size:12px;color:#667085">1.2km · 排队较少 · 预计 5 分钟</span></div><div class="detail-visual"><span style="font-weight:950;color:#1d4ed8">门店地图区域</span></div>`],
      menu:['菜单','选择分类、商品和加料',()=>`<div class="menu-layout"><div class="cats">${['人气','拿铁','美式','甜品','周边'].map(x=>`<button class="cat ${x===cat?'active':''}" data-cat="${x}">${x}</button>`).join('')}</div><div class="items">${(cat==='甜品'?['cake','coco']:cat==='美式'?['americano','latte']:['latte','americano','cake']).map(menuItem).join('')}</div></div>`],
      detail:['商品详情','厚乳拿铁 · 4.9 分 · 月售 3,428',()=>`<div class="detail-visual"><div class="coffee" style="transform:scale(1.55)"></div></div><div class="section-title"><b>厚乳拿铁</b><span class="price">¥21</span></div><p style="font-size:12px;color:#667085;line-height:1.5;margin:0 0 12px">双份浓缩搭配厚乳，口感绵密，适合上午提神和下午补能。</p><div class="section-title"><b>杯型</b></div><div class="option-grid"><button class="option active">中杯</button><button class="option">大杯 +¥4</button></div><div class="section-title"><b>温度 / 糖度</b></div><div class="option-grid"><button class="option active">少冰</button><button class="option">热饮</button><button class="option active">半糖</button><button class="option">无糖</button></div><div class="buybar"><button id="addCart">加入购物车</button><button>立即购买</button></div>`],
      cart:['购物车',`${cart} 件商品 · 可用 2 张券`,()=>`<div class="order-card"><b>厚乳拿铁</b><span class="price" style="float:right">¥21</span><br><span style="font-size:12px;color:#667085">中杯 / 少冰 / 半糖 × ${cart}</span></div><div class="coupon"><b>满 30 减 8</b><span class="badge">可用</span></div><div class="buybar"><button>继续点单</button><button>去结算 ¥${21*cart}</button></div>`],
      order:['订单','当前订单 · 门店自提',()=>`<div class="order-card"><div style="display:flex;justify-content:space-between"><b>订单 #C20260605</b><span class="badge">制作中</span></div><div class="timeline">${['已支付 09:36','门店接单 09:37','正在制作 预计 8 分钟','等待取餐 出示取餐码'].map((x,i)=>`<div class="step ${i<2?'done':''}"><i></i><div><b>${x.split(' ')[0]}</b><br><span>${x.split(' ').slice(1).join(' ')}</span></div></div>`).join('')}</div></div>`],
      pickup:['取餐码','到店出示给店员核销',()=>`<div class="detail-visual" style="background:#fff"><div style="font-size:46px;font-weight:980;letter-spacing:.14em">A 238</div></div><div class="order-card"><b>万象城 B1 店</b><br><span style="font-size:12px;color:#667085">取餐码 10 分钟内有效，过期自动刷新。</span></div>`],
      member:['会员中心','Gold Member · 成长值 7,260',()=>`<div class="member-card"><h3>Gold Member</h3><p>再消费 240 元升级 Platinum</p><div class="stats"><div><b>7,260</b><span>积分</span></div><div><b>12</b><span>券包</span></div><div><b>41%</b><span>复购</span></div></div></div><div class="section-title"><b>我的优惠</b></div><div class="coupon"><b>满 30 减 8</b><span class="badge">去使用</span></div><div class="coupon"><b>会员日第 2 杯半价</b><span class="badge">已领取</span></div><div class="section-title"><b>历史订单</b><button class="link" data-page="history">查看全部</button></div><div class="order-card"><b>厚乳拿铁 · 草莓芝士卷</b><br><span style="font-size:12px;color:#667085">昨天 09:42 · ¥45 · 已完成</span></div>`],

      history:['历史订单','复购、评价和售后入口',()=>`<div class="order-card"><b>厚乳拿铁 · 草莓芝士卷</b><br><span style="font-size:12px;color:#667085">昨天 09:42 · ¥45 · 已完成</span><br><br><span class="badge">再来一单</span></div><div class="order-card"><b>冰摇美式</b><br><span style="font-size:12px;color:#667085">周一 14:16 · ¥15 · 已完成</span><br><br><span class="badge">去评价</span></div><div class="order-card"><b>生椰拿铁</b><br><span style="font-size:12px;color:#667085">5 月 28 日 · ¥19 · 已退款</span><br><br><span class="badge">查看售后</span></div>`]
    };
    function groupFor(page){return groups.find(g=>g[2].some(x=>x[0]===page))?.[0]||openGroup}
    function renderNav(){document.getElementById('nav').innerHTML=groups.map(g=>`<div><button class="group-toggle ${g[0]===openGroup?'open':''}" data-group="${g[0]}"><i>${g[1]}</i><span>${g[0]}</span><b>${g[0]===openGroup?'⌃':'⌄'}</b></button><div class="subnav ${g[0]===openGroup?'':'hidden'}">${g[2].map(x=>`<button class="${x[0]===active?'active':''}" data-page="${x[0]}">${x[1]}</button>`).join('')}</div></div>`).join('')}
    function render(){const p=pages[active];document.getElementById('pageTitle').textContent=p[0];document.getElementById('pageDesc').textContent=p[1];document.getElementById('content').innerHTML=p[2]();document.getElementById('tabbar').innerHTML=[['home','⌂','首页'],['menu','☕','菜单'],['cart','▣','购物车'],['order','✓','订单'],['member','◇','会员']].map(x=>`<button class="${active===x[0]?'active':''}" data-page="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('');renderNav();bind()}
    function bind(){document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{openGroup=openGroup===b.dataset.group?'':b.dataset.group;renderNav();bind()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{active=b.dataset.page;openGroup=groupFor(active);render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});document.querySelectorAll('[data-add],#addCart').forEach(b=>b.onclick=()=>{cart++;active='cart';openGroup=groupFor(active);render()});const sh=document.getElementById('shuffle');if(sh)sh.onclick=()=>{batch=1-batch;render()};const car=document.getElementById('carousel');if(car)car.onclick=()=>{banner=(banner+1)%3;render()};document.querySelectorAll('.option').forEach(o=>o.onclick=()=>o.classList.toggle('active'))}
    document.getElementById('collapse').onclick=()=>{document.getElementById('layout').classList.toggle('closed');document.getElementById('collapse').textContent=document.getElementById('layout').classList.contains('closed')?'›':'‹'};
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.body.classList.toggle('low',b.dataset.mode==='low')});
    if(location.hash==='#low'){document.querySelector('[data-mode="low"]').click()}
    if(location.hash==='#closed'){document.getElementById('layout').classList.add('closed');document.getElementById('collapse').textContent='›'}
    render();
  </script>
