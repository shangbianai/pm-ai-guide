315.0" height="76"><div xmlns="http://www.w3.org/1999/xhtml" class="note-text">业务希望 AI 自动处置高风险告警</div></foreignObject></g><g class="note" transform="rotate(0.35 614.5 434.0)"><rect x="441.0" y="384" width="347.0" height="100" rx="18" fill="#fffdf8" stroke="#e67700" stroke-dasharray="9 5"/><foreignObject x="457.0" y="398" width="315.0" height="76"><div xmlns="http://www.w3.org/1999/xhtml" class="note-text">技术担心误报导致非计划停机</div></foreignObject></g><g class="note" transform="rotate(-0.2 614.5 552.0)"><rect x="441.0" y="502" width="347.0" height="100" rx="2" fill="#fffdf8" stroke="#e67700"/><foreignObject x="457.0" y="516" width="315.0" height="76"><div xmlns="http://www.w3.org/1999/xhtml" class="note-text">现场需要离线工单，范围待确认</div></foreignObject></g><g class="note" transform="rotate(-0.5 614.5 670.0)"><rect x="441.0" y="620" width="347.0" height="100" rx="7" fill="#fffdf8" stroke="#e67700"/><foreignObject x="457.0" y="634" width="315.0" height="76"><div xmlns="http://www.w3.org/1999/xhtml" class="note-text">是否同时替换现有 EAM 存在分歧</div></foreignObject></g><g class="note header" transform="rotate(-0.4 985.5 213)"><rect x="812.0" y="180" width="347.0" height="66" rx="18" fill="#b2f2bb" stroke="#2b8a3e"/><text x="830.0" y="222" class="header-text">决策共识</text></g><g class="note" transform="rotate(-0.5 985.5 316.0)"><rect x="812.0" y="266" width="347.0" height="100" rx="7" fill="#fffdf8" stroke="#2b8a3e"/><foreignObject x="828.0" y="280" width="315.0" height="76"><div xmlns="http://www.w3.org/1999/xhtml" class="note-text">MVP 不替换原系统，仅做聚合与闭环</div></foreignObject></g><g class="note" transform="rotate(0.35 985.5 434.0)"><rect x="812.0" y="384" width="347.0" height="100" rx="18" fill="#fffdf8" stroke="#2b8a3e"/><foreignObject x="828.0" y="398" width="315.0" height="76"><div xmlns="http://www.w3.org/1999/xhtml" class="note-text">高风险动作必须人工确认</div></foreignObject></g><g class="note" transform="rotate(-0.2 985.5 552.0)"><rect x="812.0" y="502" width="347.0" height="100" rx="2" fill="#fffdf8" s